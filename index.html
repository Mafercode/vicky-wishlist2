/* La hoja más clara con bordes rotos */
.sheet{max-width:1000px;margin:0 auto;filter:drop-shadow(0 6px 10px rgba(110,40,20,.3))}
.paper{background:rgba(250,216,146,.94);padding:24px 14px 30px;clip-path:polygon(0 6px,5% 0,12% 5px,20% 1px,30% 6px,40% 0,50% 5px,60% 1px,70% 6px,80% 0,90% 5px,100% 1px,100% calc(100% - 5px),92% 100%,80% calc(100% - 6px),65% 100%,50% calc(100% - 5px),35% 100%,20% calc(100% - 6px),8% 100%,0 calc(100% - 4px))}
/* Cabecera: todo se mide en cqw = % del ancho de la cabecera */
.hero{container-type:inline-size;position:relative;max-width:560px;margin:0 auto}
.top{position:relative;padding:0 22%;text-align:center}
h1{margin:0;font:400 14.5cqw/.9 Anton,Impact,sans-serif;color:var(--cereza);text-transform:uppercase}
.s{position:absolute;height:auto;pointer-events:none}
.dd{position:absolute;aspect-ratio:1;height:auto;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 1px rgba(140,70,20,.55));pointer-events:none}
.thx,.brindis{position:absolute;font-family:Caveat,cursive;font-weight:600;color:var(--vino)}
.thx{right:0;top:24cqw;width:20%;font-size:4.8cqw;line-height:1.05;transform:rotate(-8deg)}
.intro{text-align:center;font-size:clamp(12px,3.9cqw,18px);line-height:1.3;margin:14px 0 8px}
.warn{text-align:center;font-size:clamp(10px,3.1cqw,14px);font-weight:600;line-height:1.35;margin:0}
.stage{position:relative;aspect-ratio:1/.74;margin-top:2px}
.kid{z-index:2;bottom:0;height:84%}
.kid1{left:20%}.kid2{left:44%}
.cock{left:0;top:6%;width:20%}.dog{right:0;top:4%;width:23%}
.cat{left:-1%;bottom:0;width:28%}.lemon{right:1%;bottom:14%;width:24%}.shot2{left:17%;bottom:30%;width:9%;transform:rotate(-14deg)}
.brindis{right:0;bottom:0;font-size:6.5cqw;transform:rotate(-4deg)}
/* Contador y buscador */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:16px 0 24px}
.count{font:italic 700 13px 'Courier Prime',monospace;text-transform:uppercase;border:1.5px solid var(--vino);border-radius:50%/60%;padding:6px 14px;transform:rotate(-2deg)}
.search{flex:1;min-width:150px;max-width:260px;display:flex;align-items:center;gap:6px;border:1.5px solid var(--vino);border-radius:20px;padding:5px 10px;background:rgba(255,255,255,.35)}
.search input{border:0;background:none;flex:1;min-width:0;font:inherit;font-size:14px;color:var(--vino);outline:none}
.search button{border:0;background:none;font-size:16px;color:var(--vino);cursor:pointer}
/* Tarjetas tipo polaroid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:28px 14px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}.paper{padding:32px 28px 40px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{position:relative;background:var(--crema);padding:8px 8px 10px;box-shadow:0 3px 8px rgba(80,30,10,.3);display:flex;flex-direction:column;transform:rotate(var(--rot))}
.pin{position:absolute;top:-8px;width:18px;height:18px;border-radius:50%;z-index:3;background:radial-gradient(circle at 35% 30%,#fffa 0 14%,var(--c) 16%);box-shadow:0 3px 3px #0005,inset -2px -2px 3px #0004}
.tape{position:absolute;top:-11px;left:50%;width:64px;height:20px;z-index:3;opacity:.9;transform:translateX(-50%) rotate(var(--r));background:repeating-linear-gradient(45deg,var(--c) 0 6px,var(--c2) 6px 12px);box-shadow:0 1px 3px #0003}
.ph{position:relative;aspect-ratio:1;background:#f1e3cc;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:44px}
.ph img{width:100%;height:100%;object-fit:cover}
.ttl{font-weight:600;text-transform:uppercase;text-align:center;font-size:13px;line-height:1.15;margin:9px 2px 4px;color:#3b2a2a}
.note{font-size:11.5px;text-align:center;color:#6b4a45;margin:0 2px 8px;word-break:break-word}
.note a{color:var(--cereza)}
.taken .ttl,.taken .note{text-decoration:line-through;opacity:.65}
.stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-14deg);font:400 20px Anton,Impact,sans-serif;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;color:#c2185b;border:3px solid #c2185b;border-radius:6px;padding:2px 10px;background:rgba(255,250,240,.85)}
.own{position:absolute;right:5px;bottom:5px;display:flex;gap:5px;z-index:4}
.own button{width:30px;height:30px;border-radius:50%;border:0;background:#fffc;font-size:15px;cursor:pointer;box-shadow:0 1px 4px #0004}
.pick{margin-top:auto;border:2px solid var(--cereza);background:var(--cereza);color:#fff;font:600 12.5px Oswald,sans-serif;text-transform:uppercase;letter-spacing:.5px;padding:9px 6px;border-radius:999px;cursor:pointer}
.pick.off{background:transparent;color:var(--cereza)}
.empty{grid-column:1/-1;text-align:center;font-size:15px}
/* Panel del dueño */
.panel{background:var(--crema);border:2px dashed var(--cereza);border-radius:12px;padding:14px;margin:0 auto 26px;max-width:480px}
.panel h2{margin:0 0 10px;font-size:18px}
.panel label{display:block;font-size:13px;margin-bottom:10px}
.panel input[type=text],.panel textarea{display:block;width:100%;margin-top:4px;padding:8px;border:1.5px solid var(--vino);border-radius:8px;font:inherit;background:#fff}
.panel .row{display:flex;gap:8px}.panel .pick{flex:1}
.panel small{display:block;margin:-4px 0 8px;color:var(--cereza)}
.foot{text-align:center;margin-top:34px}
.ownerbtn{background:none;border:0;font:inherit;font-size:11px;color:rgba(110,27,52,.55);text-decoration:underline;cursor:pointer}
</style>
</head>

<script>
// ============ 1) PEGÁ TUS DATOS ACÁ ============
const firebaseConfig = {
  apiKey: "AIzaSyCY6nfHIShHDl0tAOdPgHGeFagZwcIQ3IM",
  authDomain: "wishlist-vicky.firebaseapp.com",
  projectId: "wishlist-vicky",
  storageBucket: "wishlist-vicky.firebasestorage.app",
  messagingSenderId: "1008318661355",
  appId: "1:1008318661355:web:2b98c4e2d45be2051634ae"
};
const ADMIN_PASS = "vicky21"; // la clave del modo dueño
// ===============================================

const $ = id => document.getElementById(id);
let db, items = [], taken = new Set(), isOwner = false, editingId = null, newPhoto = null;

// Escapa texto para que nadie meta HTML raro, y vuelve clickeables los links
const esc = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const linkify = t => esc(t).replace(/(https?:\/\/[^\s]+|www\.[^\s]+)/g, u =>
  `<a href="${u.startsWith('www') ? 'https://' + u : u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

// Alerta con el código real del error y una sugerencia
function showError(accion, e) {
  const code = (e && e.code) || (e && e.message) || 'desconocido';
  const ayudas = {
    'permission-denied': 'Firebase rechazó la operación. Hay que publicar las reglas de Firestore: en Firebase andá a Firestore Database > Reglas, pegá las reglas abiertas y tocá "Publicar".',
    'unavailable': 'No hay conexión con Firebase. Revisá tu internet y probá de nuevo.',
    'not-found': 'No se encontró la base de datos. Verificá que creaste Firestore Database y que el projectId esté bien pegado.',
    'invalid-argument': 'Algún dato no es válido o la foto es demasiado pesada. Probá con otra foto.',
    'resource-exhausted': 'Se llegó al límite gratuito de Firebase por hoy. Probá más tarde.',
    'unauthenticated': 'La configuración de Firebase (apiKey) parece incorrecta. Volvé a copiarla.'
  };
  alert(`No se pudo ${accion}.\n\nCódigo de error: ${code}\n\n${ayudas[code] || 'Buscá este código en la documentación de Firestore para ver qué significa.'}`);
}

// Achica la foto: máximo 500 px de lado, JPEG calidad 0.72
function resizePhoto(file) {
  return new Promise((ok, fail) => {
    const r = new FileReader();
    r.onerror = () => fail(new Error('lectura-fallida'));
    r.onload = () => {
      const im = new Image();
      im.onerror = () => fail(new Error('imagen-invalida'));
      im.onload = () => {
        const k = Math.min(1, 500 / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        const x = c.getContext('2d');
        x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
        x.drawImage(im, 0, 0, c.width, c.height);
        ok(c.toDataURL('image/jpeg', 0.72));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

// Pines y cintas de colores para sujetar cada regalo
const DECO = [['pin','#c2185b','left:12px'],['tape','#f48fb1','#fff3c4'],['pin','#1e88e5','right:12px'],
  ['tape','#80cbc4','#fff59d'],['pin','#43a047','left:calc(50% - 9px)'],['tape','#ffb74d','#ef9a9a']];

function card(i) {
  const n = items.indexOf(i), d = DECO[n % DECO.length], t = taken.has(i.id);
  const deco = d[0] === 'pin'
    ? `<span class="pin" style="--c:${d[1]};${d[2]}"></span>`
    : `<span class="tape" style="--c:${d[1]};--c2:${d[2]};--r:${n % 2 ? 3 : -4}deg"></span>`;
  return `<div class="card${t ? ' taken' : ''}" style="--rot:${[-1.2, .8, -.6, 1.2][n % 4]}deg">${deco}
    <div class="ph">${i.photo ? `<img src="${i.photo}" alt="">` : '📷'}${t ? '<span class="stamp">¡Ya elegido!</span>' : ''}
    ${isOwner ? `<div class="own"><button data-a="edit" data-id="${i.id}" title="Editar">✎</button><button data-a="del" data-id="${i.id}" title="Eliminar">✕</button></div>` : ''}</div>
    <div class="ttl">${esc(i.title)}</div>${i.note ? `<div class="note">${linkify(i.note)}</div>` : ''}
    <button class="pick${t ? ' off' : ''}" data-a="tog" data-id="${i.id}">${t ? 'Desmarcar' : 'Elegir este regalo'}</button></div>`;
}

function render() {
  const q = norm($('q').value.trim());
  const libres = items.filter(i => !taken.has(i.id)).length;
  $('count').textContent = libres + (libres === 1 ? ' regalo disponible' : ' regalos disponibles');
  const lista = items.filter(i => norm(i.title + ' ' + i.note).includes(q));
  $('grid').innerHTML = lista.length ? lista.map(card).join('')
    : `<p class="empty">${items.length ? 'No encontré regalos con esa búsqueda.' : 'Todavía no hay regalos en la lista.'}</p>`;
}

// Elegir / desmarcar: solo se guarda { taken: true }, nunca quién lo eligió
async function toggle(id) {
  try {
    if (taken.has(id)) {
      if (!confirm('¿Desmarcar este regalo? Quedará disponible otra vez.')) return;
      await db.collection('taken').doc(id).delete();
    } else {
      await db.collection('taken').doc(id).set({ taken: true });
    }
  } catch (e) { showError('actualizar el regalo', e); }
}

async function del(id) {
  if (!confirm('¿Eliminar este regalo de la lista? No se puede deshacer.')) return;
  try {
    const b = db.batch();
    b.delete(db.collection('items').doc(id));
    b.delete(db.collection('taken').doc(id));
    await b.commit();
    if (editingId === id) cancelEdit();
  } catch (e) { showError('eliminar el regalo', e); }
}

function startEdit(id) {
  const i = items.find(x => x.id === id); if (!i) return;
  editingId = id; newPhoto = null;
  $('title').value = i.title; $('note').value = i.note || ''; $('photo').value = ''; $('pinfo').textContent = '';
  $('rmPhoto').checked = false; $('rmRow').hidden = !i.photo;
  $('ptitle').textContent = 'Editar regalo'; $('save').textContent = 'Guardar cambios'; $('cancel').hidden = false;
  $('panel').scrollIntoView({ behavior: 'smooth' });
}

function cancelEdit() {
  editingId = null; newPhoto = null; $('form').reset(); $('pinfo').textContent = '';
  $('rmRow').hidden = true; $('ptitle').textContent = 'Agregar un regalo';
  $('save').textContent = 'Agregar regalo'; $('cancel').hidden = true;
}

$('photo').onchange = async e => {
  const f = e.target.files[0]; newPhoto = null; $('pinfo').textContent = '';
  if (!f) return;
  try { newPhoto = await resizePhoto(f); $('pinfo').textContent = 'Foto lista ✓'; }
  catch (err) {
    e.target.value = '';
    alert(`No se pudo leer la foto (error: ${err.message}).\nProbá con otra imagen JPG o PNG. El regalo todavía no se guardó.`);
  }
};

$('form').onsubmit = async e => {
  e.preventDefault();
  const title = $('title').value.trim(), note = $('note').value.trim();
  if (!title) { alert('Poné un título para el regalo.'); return; }
  $('save').disabled = true;
  try {
    if (editingId) { // editar: se actualiza el MISMO documento (mantiene posición y estado)
      const d = { title, note };
      if (newPhoto) d.photo = newPhoto; else if ($('rmPhoto').checked) d.photo = '';
      await db.collection('items').doc(editingId).update(d);
    } else {
      await db.collection('items').add({ title, note, photo: newPhoto || '', createdAt: Date.now() });
    }
    cancelEdit();
  } catch (err) { showError('guardar el regalo', err); }
  $('save').disabled = false;
};

$('cancel').onclick = cancelEdit;
$('q').oninput = render;
$('clr').onclick = () => { $('q').value = ''; render(); $('q').focus(); };
$('grid').onclick = e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const id = b.dataset.id, a = b.dataset.a;
  if (a === 'tog') toggle(id); else if (a === 'del') del(id); else if (a === 'edit') startEdit(id);
};

$('ownerBtn').onclick = () => {
  if (isOwner) { isOwner = false; cancelEdit(); }
  else {
    const p = prompt('Ingresá la clave de dueño:');
    if (p === null) return;
    if (p !== ADMIN_PASS) { alert('Clave incorrecta.'); return; }
    isOwner = true;
  }
  $('panel').hidden = !isOwner;
  $('ownerBtn').textContent = isOwner ? 'Salir del modo dueño' : 'Soy el dueño de la lista';
  render();
  if (isOwner) $('panel').scrollIntoView({ behavior: 'smooth' });
};

// ============ Arranque ============
const configOk = Object.values(firebaseConfig).every(v => v && !String(v).includes('PEGAR_AQUI'));
if (!configOk) {
  $('count').textContent = '';
  $('grid').innerHTML = '<p class="empty">Falta pegar la configuración de Firebase en el archivo.</p>';
} else {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  const leerError = e => {
    $('grid').innerHTML = `<p class="empty">No se pudo cargar la lista (${esc(e.code || e.message)}).</p>`;
    if (!leerError.hecho) { leerError.hecho = true; showError('leer la lista', e); }
  };
  // onSnapshot = tiempo real: cualquier cambio se ve al instante en todos los celulares
  db.collection('items').orderBy('createdAt').onSnapshot(s => {
    items = s.docs.map(d => ({ id: d.id, ...d.data() })); render();
  }, leerError);
  db.collection('taken').onSnapshot(s => {
    taken = new Set(s.docs.map(d => d.id)); render();
  }, leerError);
}
</script>
</body>
</html>
